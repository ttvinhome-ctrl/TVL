name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip proyek
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            Z="$(ls -1 *.zip 2>/dev/null | head -n1)"
            if [ -z "$Z" ]; then echo "Tidak ada file .zip di repo"; exit 1; fi
            echo "Mengekstrak: $Z"
            mkdir -p /tmp/proj
            unzip -oq "$Z" -d /tmp/proj
            S="$(find /tmp/proj -name settings.gradle.kts | head -n1)"
            if [ -z "$S" ]; then echo "settings.gradle.kts tidak ditemukan di dalam zip"; exit 1; fi
            echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Siapkan Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradlew belum ada, membuat otomatis..."
            mkdir -p /tmp/wrapgen
            (cd /tmp/wrapgen && gradle wrapper --gradle-version 8.7 --no-daemon)
            cp /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat .
            mkdir -p gradle/wrapper
            cp /tmp/wrapgen/gradle/wrapper/* gradle/wrapper/
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build APK
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          cd "$PROJECT_DIR"
          V="0.0.${GITHUB_RUN_NUMBER}"
          ./gradlew assembleRelease --stacktrace \
            -PVER_NAME="$V" -PVER_CODE="$GITHUB_RUN_NUMBER" -PGITHUB_REPO="$GITHUB_REPOSITORY"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/TvLauncher.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TvLauncher
          path: out/TvLauncher.apk

      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: Launcher v0.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/TvLauncher.apk
